<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory | Shree Saraswati Secondary School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1e1b4b;
      --primary-light: #312e81;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-hover: #6d28d9;
      --secondary: #f59e0b;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #ea580c;
      --white: #ffffff;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-color: #f5f3ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* ────────── HEADER ──────────── */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: var(--white);
      padding: 3rem 2rem;
      box-shadow: 0 10px 30px rgba(30, 27, 75, 0.2);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.3) 0%, transparent 70%);
      border-radius: 50%;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* ────────── STATS BAR ──────────── */
    .stats-container {
      max-width: 1400px;
      margin: -2rem auto 3rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      position: relative;
      z-index: 2;
    }

    .stat-box {
      background: var(--white);
      padding: 1.8rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border-left: 4px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .stat-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .stat-icon.blue { background: #e0f2fe; color: #0284c7; }
    .stat-icon.green { background: #dcfce7; color: #16a34a; }
    .stat-icon.purple { background: #f3e8ff; color: #7c3aed; }
    .stat-icon.amber { background: #fef3c7; color: #f59e0b; }

    .stat-info h3 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.2rem;
    }

    .stat-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ────────── FILTER & SEARCH SECTION ──────────── */
    .filter-section {
      max-width: 1400px;
      margin: 0 auto 2.5rem;
      padding: 0 2rem;
    }

    .filter-controls {
      background: var(--white);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--gray-200);
    }

    .search-bar {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 1rem;
      align-items: end;
      margin-bottom: 1.5rem;
    }

    .search-input-group {
      position: relative;
    }

    .search-input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .search-input-group input,
    .search-input-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .search-input-group input:focus,
    .search-input-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .btn-group {
      display: flex;
      gap: 0.8rem;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--gray-200);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: var(--gray-300);
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #f0e5ff;
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--accent-light);
    }

    .filter-tag button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
      line-height: 1;
    }

    /* ────────── STUDENT GRID ──────────── */
    .students-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-title span {
      background: var(--accent);
      color: var(--white);
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    /* ────────── STUDENT CARD ──────────── */
    .student-card {
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .student-card:hover {
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.15);
      transform: translateY(-8px);
      border-color: var(--accent);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      padding: 1.5rem;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    .card-header::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .card-avatar {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 0.8rem;
      position: relative;
      z-index: 1;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .card-header h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      position: relative;
      z-index: 1;
    }

    .card-header p {
      font-size: 0.9rem;
      opacity: 0.85;
      position: relative;
      z-index: 1;
    }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 0.8rem;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
    }

    .status-badge.enrolled {
      background: rgba(16, 185, 129, 0.2);
      color: #059669;
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: #d97706;
    }

    .status-badge.approved {
      background: rgba(34, 197, 94, 0.2);
      color: #16a34a;
    }

    .status-badge.rejected {
      background: rgba(239, 68, 68, 0.2);
      color: #dc2626;
    }

    .card-body {
      padding: 1.5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .info-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-icon {
      width: 20px;
      height: 20px;
      background: #e0f2fe;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #0284c7;
    }

    .card-divider {
      height: 1px;
      background: var(--gray-200);
    }

    .card-footer {
      padding: 0 1.5rem 1.5rem;
      display: flex;
      gap: 0.8rem;
    }

    .btn-small {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--white);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-small:hover {
      background: var(--gray-100);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-small.primary {
      background: var(--accent);
      color: var(--white);
      border-color: var(--accent);
    }

    .btn-small.primary:hover {
      background: var(--accent-hover);
    }

    /* ────────── EMPTY STATE ──────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* ────────── LOADING STATE ──────────── */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--gray-200);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ────────── MODAL ──────────── */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: var(--white);
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--white);
      font-size: 1.5rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .modal-body {
      padding: 2rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--gray-200);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .detail-value {
      font-weight: 700;
      color: var(--primary);
      text-align: right;
    }

    /* ────────── RESPONSIVE ──────────── */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .search-bar {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }

      .students-grid {
        grid-template-columns: 1fr;
      }

      .stats-container {
        grid-template-columns: repeat(2, 1fr);
      }

      .header {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <div class="header-content">
      <h1>📚 Student Directory</h1>
      <p>View all enrolled students and admission applications</p>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-container">
    <div class="stat-box">
      <div class="stat-icon blue">👥</div>
      <div class="stat-info">
        <h3 id="totalStudents">0</h3>
        <p>Total Students</p>
      </div>
    </div>
    <div class="stat-box">
      <div class="stat-icon green">✓</div>
      <div class="stat-info">
        <h3 id="enrolledCount">0</h3>
        <p>Enrolled</p>
      </div>
    </div>
    <div class="stat-box">
      <div class="stat-icon amber">⏳</div>
      <div class="stat-info">
        <h3 id="pendingCount">0</h3>
        <p>Pending Admission</p>
      </div>
    </div>
    <div class="stat-box">
      <div class="stat-icon purple">📊</div>
      <div class="stat-info">
        <h3 id="classesCount">0</h3>
        <p>Classes</p>
      </div>
    </div>
  </div>

  <!-- FILTER SECTION -->
  <div class="filter-section">
    <div class="filter-controls">
      <div class="search-bar">
        <div class="search-input-group" style="grid-column: 1;">
          <label>Search</label>
          <input type="text" id="searchInput" placeholder="Search by name or ID...">
        </div>
        <div class="search-input-group">
          <label>Class</label>
          <select id="filterClass">
            <option value="">All Classes</option>
          </select>
        </div>
        <div class="search-input-group">
          <label>Status</label>
          <select id="filterStatus">
            <option value="">All Status</option>
            <option value="enrolled">Enrolled</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="applyFilters()">🔍 Filter</button>
          <button class="btn btn-secondary" onclick="clearFilters()">✕ Clear</button>
        </div>
      </div>
      <div class="filter-tags" id="activeTags"></div>
    </div>
  </div>

  <!-- STUDENTS SECTION -->
  <div class="students-section">
    <h2 class="section-title">
      All Students
      <span id="studentCount">0</span>
    </h2>
    <div class="students-grid" id="studentsGrid">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- DETAIL MODAL -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalStudentName">Student Details</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Details will be populated here -->
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script src="../js/supabase-client.js"></script>
  <script>
    let allStudents = [];
    let filteredStudents = [];
    let classHandler = null;

    // Initialize
    async function initializeDirectory() {
      try {
        await loadStudents();
        await populateClassFilter();
        updateStats();
      } catch (error) {
        console.error('Error initializing directory:', error);
      }
    }

    // Load students from both tables
    async function loadStudents() {
      const grid = document.getElementById('studentsGrid');
      grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        if (!window.supabaseDb) {
          console.error('Supabase not initialized');
          grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Connection Error</h3><p>Unable to connect to database</p></div>';
          return;
        }

        // Load enrolled students
        const { data: students, error: studentsError } = await window.supabaseDb
          .from('students')
          .select('*')
          .order('full_name', { ascending: true });

        if (studentsError) {
          console.error('Error loading students:', studentsError);
        }

        // Load admission applications
        const { data: admissions, error: admissionsError } = await window.supabaseDb
          .from('admission_applications')
          .select('*')
          .order('full_name', { ascending: true });

        if (admissionsError) {
          console.error('Error loading admissions:', admissionsError);
        }

        // Combine and format data
        allStudents = [];

        // Add enrolled students
        if (students && students.length > 0) {
          students.forEach(student => {
            allStudents.push({
              ...student,
              type: 'enrolled',
              source: 'students',
              displayName: student.full_name || 'Unknown',
              displayClass: student.class_name || '-',
              displayStatus: 'enrolled',
              displayRoll: student.roll_number || '-',
              displayPhone: student.phone_number || '-',
              displayEmail: student.email || '-',
              displayDOB: student.date_of_birth || '-',
              displayGender: student.gender || '-'
            });
          });
        }

        // Add admission applications
        if (admissions && admissions.length > 0) {
          admissions.forEach(app => {
            allStudents.push({
              ...app,
              type: 'admission',
              source: 'admission_applications',
              displayName: app.full_name || 'Unknown',
              displayClass: app.class_applying_for || '-',
              displayStatus: (app.application_status || 'pending').toLowerCase(),
              displayRoll: 'N/A',
              displayPhone: app.father_phone || app.mother_phone || '-',
              displayEmail: app.father_email || app.mother_email || '-',
              displayDOB: app.date_of_birth || '-',
              displayGender: app.gender || '-'
            });
          });
        }

        filteredStudents = [...allStudents];
        displayStudents(filteredStudents);

        if (allStudents.length === 0) {
          grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>No Students Found</h3><p>There are no students or admission applications in the system yet.</p></div>';
        }
      } catch (error) {
        console.error('Error in loadStudents:', error);
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Error Loading Data</h3><p>An error occurred while loading students. Please try again.</p></div>';
      }
    }

    // Display students in grid
    function displayStudents(students) {
      const grid = document.getElementById('studentsGrid');
      
      if (students.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><div class="empty-icon">🔍</div><h3>No Results</h3><p>No students found matching your filters.</p></div>';
        return;
      }

      grid.innerHTML = students.map(student => createStudentCard(student)).join('');
      document.getElementById('studentCount').textContent = students.length;
    }

    // Create student card HTML
    function createStudentCard(student) {
      const getInitials = (name) => {
        return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
      };

      const getGenderEmoji = (gender) => {
        if (!gender) return '👤';
        return gender.toLowerCase() === 'male' ? '👨' : '👩';
      };

      const getStatusClass = (status) => {
        switch (status.toLowerCase()) {
          case 'enrolled': return 'enrolled';
          case 'approved': return 'approved';
          case 'pending': return 'pending';
          case 'rejected': return 'rejected';
          default: return 'pending';
        }
      };

      const getStatusLabel = (status) => {
        const labels = {
          'enrolled': 'Enrolled',
          'approved': 'Approved',
          'pending': 'Pending',
          'rejected': 'Rejected'
        };
        return labels[status.toLowerCase()] || status;
      };

      return `
        <div class="student-card" onclick="showDetails('${encodeURIComponent(JSON.stringify(student))}')">
          <div class="card-header">
            <div class="card-avatar">${getGenderEmoji(student.displayGender)}</div>
            <h3>${student.displayName}</h3>
            <p>${student.type === 'enrolled' ? 'Enrolled Student' : 'New Admission'}</p>
            <span class="status-badge ${getStatusClass(student.displayStatus)}">${getStatusLabel(student.displayStatus)}</span>
          </div>
          <div class="card-body">
            <div class="info-row">
              <label class="info-label">Class</label>
              <div class="info-value">
                <div class="info-icon">📖</div>
                ${student.displayClass}
              </div>
            </div>
            
            ${student.type === 'enrolled' ? `
              <div class="info-row">
                <label class="info-label">Roll Number</label>
                <div class="info-value">
                  <div class="info-icon">🏷️</div>
                  ${student.displayRoll}
                </div>
              </div>
            ` : ''}

            <div class="card-divider"></div>

            <div class="info-row">
              <label class="info-label">Date of Birth</label>
              <div class="info-value">
                <div class="info-icon">🎂</div>
                ${formatDate(student.displayDOB)}
              </div>
            </div>

            <div class="info-row">
              <label class="info-label">Contact</label>
              <div class="info-value">
                <div class="info-icon">📞</div>
                ${student.displayPhone === '-' ? 'N/A' : student.displayPhone}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-small primary">👁️ View Details</button>
            <button class="btn-small" onclick="event.stopPropagation();">⬇️ Download</button>
          </div>
        </div>
      `;
    }

    // Show detail modal
    function showDetails(studentJson) {
      const student = JSON.parse(decodeURIComponent(studentJson));
      const modal = document.getElementById('detailModal');
      const modalBody = document.getElementById('modalBody');
      const modalName = document.getElementById('modalStudentName');

      modalName.textContent = student.displayName;

      let detailsHTML = `
        <div class="detail-row">
          <span class="detail-label">Full Name</span>
          <span class="detail-value">${student.displayName}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Type</span>
          <span class="detail-value">${student.type === 'enrolled' ? 'Enrolled' : 'Admission Application'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="detail-value" style="text-transform: capitalize;">${student.displayStatus}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Class</span>
          <span class="detail-value">${student.displayClass}</span>
        </div>
      `;

      if (student.type === 'enrolled') {
        detailsHTML += `
          <div class="detail-row">
            <span class="detail-label">Roll Number</span>
            <span class="detail-value">${student.displayRoll}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Admission Number</span>
            <span class="detail-value">${student.admission_number || 'N/A'}</span>
          </div>
        `;
      }

      detailsHTML += `
        <div class="detail-row">
          <span class="detail-label">Date of Birth</span>
          <span class="detail-value">${formatDate(student.displayDOB)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Gender</span>
          <span class="detail-value" style="text-capitalize: true;">${student.displayGender || 'N/A'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value">${student.displayPhone}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value">${student.displayEmail}</span>
        </div>
      `;

      if (student.type === 'admission') {
        detailsHTML += `
          <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
            <h4 style="margin-bottom: 1rem; color: #1e1b4b;">Father's Information</h4>
            <div class="detail-row">
              <span class="detail-label">Father's Name</span>
              <span class="detail-value">${student.father_name || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Father's Occupation</span>
              <span class="detail-value">${student.father_occupation || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Father's Email</span>
              <span class="detail-value">${student.father_email || 'N/A'}</span>
            </div>
          </div>
          <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
            <h4 style="margin-bottom: 1rem; color: #1e1b4b;">Mother's Information</h4>
            <div class="detail-row">
              <span class="detail-label">Mother's Name</span>
              <span class="detail-value">${student.mother_name || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Mother's Occupation</span>
              <span class="detail-value">${student.mother_occupation || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Mother's Email</span>
              <span class="detail-value">${student.mother_email || 'N/A'}</span>
            </div>
          </div>
        `;
      }

      modalBody.innerHTML = detailsHTML;
      modal.classList.add('active');
    }

    // Close modal
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // Close modal when clicking outside
    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Populate class filter
    async function populateClassFilter() {
      try {
        if (!window.supabaseDb) return;

        const { data: classes, error } = await window.supabaseDb
          .from('classes')
          .select('grade_level, section_name')
          .eq('status', 'Active')
          .order('grade_level', { ascending: true })
          .order('section_name', { ascending: true });

        if (error) {
          console.error('Error loading classes:', error);
          return;
        }

        if (classes && classes.length > 0) {
          const selectElement = document.getElementById('filterClass');
          classes.forEach(cls => {
            const option = document.createElement('option');
            option.value = `${cls.grade_level}-${cls.section_name}`;
            option.textContent = `${cls.grade_level} - ${cls.section_name}`;
            selectElement.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error in populateClassFilter:', error);
      }
    }

    // Apply filters
    function applyFilters() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const filterClass = document.getElementById('filterClass').value;
      const filterStatus = document.getElementById('filterStatus').value;

      filteredStudents = allStudents.filter(student => {
        const matchSearch = !searchText || 
          student.displayName.toLowerCase().includes(searchText) ||
          (student.id && student.id.toString().includes(searchText));
        
        const matchClass = !filterClass || 
          student.displayClass === filterClass ||
          student.displayClass.includes(filterClass);
        
        const matchStatus = !filterStatus || 
          student.displayStatus === filterStatus.toLowerCase();

        return matchSearch && matchClass && matchStatus;
      });

      displayStudents(filteredStudents);
      updateActiveTags(searchText, filterClass, filterStatus);
      updateStats();
    }

    // Clear filters
    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterClass').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('activeTags').innerHTML = '';
      
      filteredStudents = [...allStudents];
      displayStudents(filteredStudents);
      updateStats();
    }

    // Update active tags
    function updateActiveTags(search, classFilter, status) {
      const tags = document.getElementById('activeTags');
      tags.innerHTML = '';

      if (search) {
        tags.innerHTML += `<div class="filter-tag">🔍 Search: ${search} <button onclick="clearFilters()">×</button></div>`;
      }
      if (classFilter) {
        tags.innerHTML += `<div class="filter-tag">📖 Class: ${classFilter} <button onclick="clearFilters()">×</button></div>`;
      }
      if (status) {
        tags.innerHTML += `<div class="filter-tag">📊 Status: ${status} <button onclick="clearFilters()">×</button></div>`;
      }
    }

    // Update statistics
    function updateStats() {
      const enrolled = allStudents.filter(s => s.displayStatus === 'enrolled').length;
      const pending = allStudents.filter(s => s.displayStatus === 'pending').length;
      const approved = allStudents.filter(s => s.displayStatus === 'approved').length;

      document.getElementById('totalStudents').textContent = allStudents.length;
      document.getElementById('enrolledCount').textContent = enrolled;
      document.getElementById('pendingCount').textContent = pending + approved;
      document.getElementById('classesCount').textContent = new Set(allStudents.map(s => s.displayClass)).size;
    }

    // Format date
    function formatDate(dateStr) {
      if (!dateStr || dateStr === '-') return 'N/A';
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr;
      return date.toLocaleDateString('en-IN', { 
        day: '2-digit', 
        month: 'short', 
        year: 'numeric' 
      });
    }

    // Allow Enter key to apply filters
    document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') applyFilters();
    });

    // Initialize on page load
    window.addEventListener('load', initializeDirectory);
  </script>
</body>
</html>
